name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Use the runner-owned temp root rather than a Windows user-profile alias.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codex-worker-runner/package-lock.json
      - name: Java unit tests and Flower Check
        shell: pwsh
        run: |
          .\mvnw.cmd -B -ntp verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Node bridge dependencies
        working-directory: codex-worker-runner
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Node bridge contracts
        working-directory: codex-worker-runner
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local helper contracts
        shell: pwsh
        run: |
          node --test tools/test/codex-worker-local.test.mjs tools/test/codex-windows-sandbox-setup.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
